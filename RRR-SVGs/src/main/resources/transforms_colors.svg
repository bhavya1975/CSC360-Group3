<svg xmlns="http://www.w3.org/2000/svg"
     width="600"
     height="500"
     viewBox="0 0 600 500">

    <defs>
        <!-- Gradients and styling -->
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4a90e2" stop-opacity="1"/>
            <stop offset="100%" stop-color="#9013fe" stop-opacity="0.8"/>
        </linearGradient>

        <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f8e71c"/>
            <stop offset="100%" stop-color="#f5a623"/>
        </radialGradient>
    </defs>

    <!-- Background rect with gradient -->
    <rect x="10" y="10" width="580" height="480" rx="15" ry="15"
          fill="url(#skyGrad)" stroke="#2c3e50" stroke-width="3"/>

    <!-- Transformed sun with radial gradient -->
    <circle cx="100" cy="100" r="45" fill="url(#sunGrad)" stroke="#d35400" stroke-width="2"/>

    <!-- Group with rotate and translate transformations -->
    <g id="star-group" transform="translate(300, 200) rotate(30)">
        <polygon points="0,-60 18,-18 63,-18 27,9 41,54 0,27 -41,54 -27,9 -63,-18 -18,-18"
                 fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    </g>

    <!-- Scaled group with nested rotation and paths -->
    <g id="transformed-shapes" transform="translate(150, 360) scale(1.2)">
        <rect x="0" y="0" width="70" height="70" rx="10" ry="10"
              fill="#2ecc71" stroke="#27ae60" stroke-width="3"
              transform="rotate(45 35 35)"/>
        <circle cx="120" cy="35" r="30" fill="#e67e22" fill-opacity="0.85" stroke="#d35400" stroke-width="2"/>
        <path d="M 180,60 Q 220,0 260,60 T 340,60" fill="none" stroke="#ffffff" stroke-width="4"/>
    </g>

    <!-- Transformed labels / lines -->
    <line x1="50" y1="460" x2="550" y2="460" stroke="#ecf0f1" stroke-width="4" stroke-dasharray="10,5"/>

</svg>

