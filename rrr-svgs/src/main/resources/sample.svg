<svg xmlns="http://www.w3.org/2000/svg"
     width="500"
     height="400"
     viewBox="0 0 500 400">

    <!-- Container group showcasing hierarchical structure -->
    <g id="basic-shapes" stroke="black" stroke-width="2">
        <rect id="rect1" x="20" y="20" width="120" height="80" rx="10" ry="10" fill="#3498db"/>
        <circle id="circle1" cx="240" cy="60" r="40" fill="#e74c3c"/>
        <ellipse id="ellipse1" cx="380" cy="60" rx="60" ry="35" fill="#2ecc71"/>
        <line id="line1" x1="20" y1="130" x2="460" y2="130" stroke="#34495e" stroke-width="4"/>
    </g>

    <!-- Polygons and polylines -->
    <g id="poly-group">
        <polyline id="polyline1" points="30,160 80,210 130,170 180,220" fill="none" stroke="#9b59b6" stroke-width="3"/>
        <polygon id="polygon1" points="260,160 310,230 210,230" fill="#f39c12" stroke="#d35400" stroke-width="2"/>
    </g>

    <!-- Path element -->
    <path id="path1" d="M 50,300 C 120,250 180,380 250,300 S 380,250 450,320" fill="none" stroke="#1abc9c" stroke-width="4"/>

</svg>
